name: Plane Bootstrap Focused

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Run focused backend test
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/tarball/${REF}" \
            -o repo.tar.gz
          mkdir repo
          tar -xzf repo.tar.gz -C repo --strip-components=1
          cd repo/apps/api
          python -m pip install -q -r requirements.txt >/dev/null 2>&1
          set +e
          pytest -q tests/test_plane_review_bootstrap.py > /tmp/pytest.log 2>&1
          status=$?
          tail -100 /tmp/pytest.log
          exit $status
