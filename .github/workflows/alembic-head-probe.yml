name: Alembic Head Probe

on:
  pull_request:
    branches:
      - feat/plane-session-exchange

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Report Alembic heads
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          revisions = {}
          referenced = set()
          for path in Path('apps/api/alembic/versions').glob('*.py'):
              tree = ast.parse(path.read_text())
              values = {}
              for node in tree.body:
                  if isinstance(node, (ast.Assign, ast.AnnAssign)):
                      target = node.targets[0] if isinstance(node, ast.Assign) else node.target
                      if isinstance(target, ast.Name) and target.id in {'revision', 'down_revision'}:
                          values[target.id] = ast.literal_eval(node.value)
              revision = values.get('revision')
              down = values.get('down_revision')
              if revision:
                  revisions[revision] = path.name
              if isinstance(down, str):
                  referenced.add(down)
              elif isinstance(down, (tuple, list)):
                  referenced.update(down)
          heads = sorted(set(revisions) - referenced)
          print(f'ALEMBIC_HEADS={heads}')
          print(f'ALEMBIC_HEAD_FILES={[revisions[h] for h in heads]}')
          raise SystemExit(1)
          PY
