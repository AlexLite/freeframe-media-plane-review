name: Plane Upload Focused Tests

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run focused tests
        shell: bash
        run: |
          set +e
          pnpm --dir apps/web exec vitest run \
            lib/plane-review-client.test.ts \
            lib/plane-review-upload.test.ts \
            components/plane-review/plane-review-first-upload.test.tsx \
            components/plane-review/plane-review-panel.test.tsx \
            --reporter=verbose > /tmp/plane-upload-vitest.log 2>&1
          status=$?
          cat /tmp/plane-upload-vitest.log
          echo "$status" > /tmp/plane-upload-vitest.status
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plane-upload-vitest-output
          path: |
            /tmp/plane-upload-vitest.log
            /tmp/plane-upload-vitest.status
          if-no-files-found: error
