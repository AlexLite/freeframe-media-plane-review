name: Cleanup legacy branches

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'AlexLite/freeframe-media-plane-review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Delete legacy and stale automation branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          delete_branch() {
            branch="$1"
            encoded="$(jq -rn --arg value "$branch" '$value|@uri')"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
            else
              echo "Branch ${branch} does not exist"
            fi
          }

          delete_branch stable
          delete_branch latest
          delete_branch chore/bootstrap-media-plane-review

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/dependabot/" \
            --jq '.[].ref' > /tmp/dependabot-refs.txt

          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            delete_branch "${ref#refs/heads/}"
          done < /tmp/dependabot-refs.txt

      - name: Remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-legacy-branches.yml
          git commit -m "chore: remove completed branch cleanup workflow"
          git push origin HEAD:develop
