name: Agent localization validation

on:
  push:
    branches:
      - agent/freeframe-ru-localization
    paths-ignore:
      - '.agent-validation/**'
  pull_request:
    branches:
      - agent/fix-freeframe-auth-settings
    types: [opened, synchronize, reopened]

concurrency:
  group: freeframe-localization-validation-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/freeframe-ru-localization

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies and refresh workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Run tests and production build
        id: validation
        shell: bash
        run: |
          set +e
          pnpm --filter web test > /tmp/freeframe-tests.log 2>&1
          TEST_STATUS=$?
          pnpm --filter web build > /tmp/freeframe-build.log 2>&1
          BUILD_STATUS=$?
          HEAD_SHA=$(git rev-parse HEAD)

          mkdir -p .agent-validation
          {
            echo "commit=${HEAD_SHA}"
            echo "tests=${TEST_STATUS}"
            echo "build=${BUILD_STATUS}"
            echo
            echo "--- test output ---"
            tail -n 200 /tmp/freeframe-tests.log
            echo
            echo "--- build output ---"
            tail -n 240 /tmp/freeframe-build.log
          } > .agent-validation/result.txt

          cat .agent-validation/result.txt
          echo "test_status=${TEST_STATUS}" >> "$GITHUB_OUTPUT"
          echo "build_status=${BUILD_STATUS}" >> "$GITHUB_OUTPUT"

      - name: Publish lockfile and validation result
        if: github.event_name == 'push'
        run: |
          git config user.name "freeframe-validation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml .agent-validation/result.txt
          git commit -m "chore: refresh lockfile and record validation [skip ci]" || true
          git push origin HEAD:agent/freeframe-ru-localization

      - name: Fail when validation failed
        if: steps.validation.outputs.test_status != '0' || steps.validation.outputs.build_status != '0'
        run: exit 1
