name: Plane Auth Test Probe

on:
  pull_request:
    branches: [develop]

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/freeframe_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-key-not-for-production
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: freeframe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt
      - name: Run database migrations
        working-directory: apps/api
        run: alembic upgrade head
      - name: Run full backend tests
        continue-on-error: true
        run: python -m pytest apps/api/tests/ -vv --tb=long > plane-auth-test-output.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: plane-auth-test-output
          path: plane-auth-test-output.txt
