name: Plane Panel Focused

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Run focused build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/tarball/${REF}" \
            -o repo.tar.gz
          mkdir repo
          tar -xzf repo.tar.gz -C repo --strip-components=1
          cd repo/apps/web
          corepack enable
          pnpm install --frozen-lockfile >/dev/null 2>&1
          set +e
          pnpm build > /tmp/build.log 2>&1
          status=$?
          tail -80 /tmp/build.log
          exit $status
